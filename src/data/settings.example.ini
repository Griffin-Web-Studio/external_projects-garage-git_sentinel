; git-sentinel - settings.example.ini
; ──────────────────────────────────────────────────────────────────────────────
; Copy this file to ~/.config/git-sentinel/settings.ini and edit as needed. The
; executable does this automatically on first start.
;
; All path values are relative to your home directory (~/) unless they begin
; with a forward slash, in which case they are treated as absolute.
; ──────────────────────────────────────────────────────────────────────────────

[paths]

; Git root (relative to user) directory scanned recursively for git
; repositories.
git_root = git

; Directory (relative to user dir) where reports older than
; desktop_retention_days are archived.
reports_archive = git/reports

; Override the Desktop path. By default git-sentinel reads:
; XDG_DESKTOP_DIR from ~/.config/user-dirs.dirs.
; Set this ONLY if your Desktop lives somewhere non-standard, or you want
; reports to go elsewhere. That said keep in mind, the point of them being on
; the Desktop is to make them visible, and annoying. If there are no issues, the
; old report will automatically be filed away and Desktop cleaned. So you only
; see report on Desktop IF AND ONLY IF there are problem.
; desktop_override = Desktop


[reports]

; Number of dated report files to keep on the Desktop at one time.
; Once this limit is exceeded the oldest reports are moved to reports_archive.
desktop_retention_days = 14

; File extension written on report files.
; "log" is conventional and opens well in most text editors.
report_extension = log


[staleness]

; A repository is flagged as stale when its most recent commit across all local
; branches is older than this many days.
stale_threshold_days = 90


[schedule]

; When true, the script runs at most once per calendar day. Subsequent logins on
; the same day exit silently without opening a window. Run with --force flag on
; the command line to bypass this for testing or in case you need to confirm the
; fix.
once_per_day = true


[ssh]

; Use SSH ControlMaster multiplexing so that each SSH host requires only one
; FIDO key authentication per scan session. After you approve a host in the
; GUI and enter your PIN once, all further git ls-remote calls to that host will
; reuse the established control socket automatically.
; It is RECOMMENDED to keep this on because from experience more than 2 requests
; in a short time will inevitably get annoying and will be habitually approved
; without checking. If you are working in a high security environment, it's
; recommended to set this to false.
;
; Set to false to disable ControlMaster entirely.  Note: with ControlMaster
; disabled, every SSH remote check may prompt for your FIDO key separately.
use_control_master = true

; How long (in seconds) to keep a control socket alive after the last
; connection to that host finishes.  The socket is also explicitly closed
; at the end of the scan regardless of this value.
control_persist_seconds = 300
