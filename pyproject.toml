[project]
name = "git-sentinel"
version = "0.1.0"
description = "Daily git repository audit tool for Linux desktops"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["gitpython>=3.1.50"]

[project.scripts]
git-sentinel = "__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
  "black>=26.3.0",
  "commitizen>=4.16.3",
  "mypy>=2.1.0",
  "pillow>=11.0",
  "pytest-cov",
  "pre-commit>=4.5.1",
  "pyinstaller>=6.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_scheme = "semver2"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
changelog_merge_prerelease = true
version_files = [
  "pyproject.toml:^version",
  "src/__init__.py:^APP_VERSION",
  "README.md:^# Local Git Sentinel",
  "README.md:releases/v",
]

[tool.commitizen.change_type_map]
feat = "Features"
fix = "Bug Fixes"
perf = "Performance Improvements"
refactor = "Refactoring"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "linux_only: skip on non-Linux platforms",
  "windows_only: skip on non-Windows platforms",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[tool.black]
line-length = 80
exclude = '''
/(
    migrations
  | venv
  | .git
)/
'''
