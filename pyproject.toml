[project]
name = "git-sentinel"
version = "1.0.0"
description = "Daily git repository audit tool for Linux desktops"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
git-sentinel = "__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
  "black>=26.3.0",
  "mypy>=2.1.0",
  "pytest-cov",
  "pre-commit>=4.5.1",
  "pyinstaller>=6.0",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
