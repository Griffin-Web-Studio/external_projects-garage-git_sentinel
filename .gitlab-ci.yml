# ───────────────────────| Git Sentinel CI/CD pipeline |────────────────────────
#
# STAGES
#
#   - .pre       (implicit) checks whether main has moved since the last
#                 nightly build
#   - test       mypy strict + pytest (runs on every pipeline)
#   - build      compile the PyInstaller binary
#   - publish    upload the binary to the Generic Package Registry
#   - release    create a GitLab Release (tagged builds only)
#
#
# TRIGGERS
#
#   MR / Commit on main:
#     -> test       (Linux + Windows)
#     -> build      (Linux + Windows)
#
#   Versioned tag:
#     -> test       (Linux + Windows)
#     -> build      (Linux + Windows)
#     -> publish    (Linux + Windows)
#     -> release
#
#   Scheduled pipeline (main):
#     -> check:nightly    compares $CI_COMMIT_SHA against the SHA recorded by
#                          the last successful nightly publish and records the
#                          result as $NIGHTLY_HAS_CHANGES ("true"/"false") in a
#                          dotenv artifact. Always succeeds - it never fails on
#                          purpose, it just reports whether there's anything to
#                          do.
#     -> trigger:nightly  forwards $NIGHTLY_HAS_CHANGES (via the dotenv
#                          artifact) into a child pipeline defined in
#                          .gitlab/ci/nightly.yml. That child pipeline's own
#                          jobs are rules-gated on $NIGHTLY_HAS_CHANGES, so on
#                          an unchanged main the entire test/build/publish
#                          suite is skipped - not failed - and only a trivial
#                          always-green no-op job runs. See that file for the
#                          nightly test/build/publish chain.
#
#
# COMMIT TYPE FILTER
#
#   Skipped entirely:
#   - docs      No code changes; nothing to test, build, or release.
#   - chore     Maintenance tasks (deps, config, tooling) with no shippable
#                output.
#   - style     [FUTURE] Formatting only; will trigger lint once a linter is
#                introduced. Skipped entirely for now as linting requires a
#                CI-authored commit.
#
#   Partially skipped (test only; no build, publish, or release):
#   - test      Test changes only; code itself is unchanged.
#
#   Partially skipped    |-> test -> build -|
#   - ci        Pipeline config changes; build runs to validate the config but
#                no shippable output (publish/release are tag/schedule gated).
#
#   Partially skipped    |-> test -> build -|
#   - build     Dependency or toolchain changes; not a shippable feature or fix.
#
#   Full pipeline        |-> test -> build -> publish -> release --|
#   - feat      Minor version bump.
#   - fix       Patch version bump.
#   - perf      Patch version bump.
#   - refactor  Patch version bump.
#   - revert    Patch version bump.
#   - BREAKING  Major version bump.
#
#
# NIGHTLY (setup):
#
#   Go to CI/CD > Schedules in GitLab and create a schedule targeting the main
#   branch (e.g. daily at 03:00 UTC).  Each run overwrites the single "nightly"
#   package entry so the download URL stays stable.
#
#   Nightly download URLs (once a schedule has run):
#   - $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/git-sentinel/nightly/git-sentinel
#   - $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/git-sentinel/nightly/git-sentinel.exe
#
#   Change detection: check:nightly downloads
#   .../packages/generic/git-sentinel/nightly/nightly-sha.txt (the commit SHA
#   recorded by the last successful nightly publish) and compares it to
#   $CI_COMMIT_SHA. A match means main hasn't moved since the last nightly, so
#   $NIGHTLY_HAS_CHANGES is set to "false" and the nightly child pipeline's
#   test/build/publish jobs are all rules-gated out. No file yet (first-ever
#   run) is treated as "always build".

# ──────────────────────────────────────────────────────────| Workflow Setup |──
#
#
# Prevents duplicate pipelines when pushing to a branch with an open MR. Without
# this, GitLab fires both a branch pipeline and an MR pipeline.
#
# auto_cancel on_new_commit: interruptible - when a new commit is pushed, cancel
# any running jobs marked `interruptible: true`.
# The "publish" and "release" jobs are explicitly marked `interruptible: false`
# so they are never cancelled mid-run.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
      # nightly always runs
    - if: $CI_PIPELINE_SOURCE == "schedule"

      # release tags always run
    - if: $CI_COMMIT_TAG

      # skip docs/chore/style
    - if: $CI_COMMIT_MESSAGE =~ /^(docs|chore|style)(\(.+\))?!?:/
      when: never

      # MR pipelines only (suppresses branch pipeline)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

      # pushes to main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# By default run all jobs on Linux and can be interrupted.
default:
  interruptible: true
  tags:
    - linux

stages:
  - test
  - build
  - publish
  - release

variables:
  BINARY:  git-sentinel
  PACKAGE: git-sentinel

# ───────────────────────────────────────────────────────| Nightly change gate |──
#
# Runs before everything else on a scheduled pipeline. Compares the current
# commit against the SHA recorded by the last successful nightly publish and
# records the verdict as $NIGHTLY_HAS_CHANGES in a dotenv artifact - it always
# exits 0. trigger:nightly (needs: check:nightly) forwards that variable into
# the nightly child pipeline, where it gates every test/build/publish job.
check:nightly:
  stage: .pre
  image: curlimages/curl:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      rm -f nightly-sha.txt
      curl --fail --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           -o nightly-sha.txt \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE/nightly/nightly-sha.txt" \
           || true
      LAST_SHA="$(cat nightly-sha.txt 2>/dev/null || echo "")"
      if [ "$LAST_SHA" = "$CI_COMMIT_SHA" ]; then
        echo "No new commits since last nightly build ($LAST_SHA) - nothing to do."
        echo "NIGHTLY_HAS_CHANGES=false" > nightly.env
      else
        echo "New commits since last nightly build ($CI_COMMIT_SHA) - proceeding."
        echo "NIGHTLY_HAS_CHANGES=true" > nightly.env
      fi
  artifacts:
    reports:
      dotenv: nightly.env

# Forwards $NIGHTLY_HAS_CHANGES (from check:nightly's dotenv artifact) into
# the nightly child pipeline as a trigger variable. strategy: depend makes
# this job's own status mirror the child pipeline's status, so a real nightly
# failure (test/build/publish) still shows up as a failed pipeline here - only
# the "nothing to do" case stays green.
trigger:nightly:
  stage: test
  needs: [check:nightly]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  trigger:
    include:
      - local: .gitlab/ci/nightly.yml
    strategy: depend

# ────────────────────────────────────────────────────────────────────| Test |──
#
# mypy strict + pytest with a 75% coverage gate.
test:
  stage: test
  image: python:3.14
  rules:
      # handled by the nightly child pipeline instead
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq xvfb tk
    - pip install uv --quiet
  script:
    - uv sync --frozen --group dev
    - uv run scripts/test.py
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'

# Uses Windows runner.
# Windows GUI tests are skipped entirely (not just deselected from coverage):
# Tkinter under uv's venv on Windows intermittently fails to find tk, causing
# flaky collection even on the same commit. --ignore=tests/unit/ui/gui keeps
# collection from ever importing tkinter on this runner.
test:windows:
  stage: test
  tags:
    - windows
  rules:
      # handled by the nightly child pipeline instead
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always
  before_script:
    - pip install uv --quiet
  script:
    - uv sync --frozen --group dev
    - uv run scripts/test.py
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'

# ───────────────────────────────────────────────────| Shared build template |──

.build:
  stage: build
  image: python:3.14
  before_script:
    - apt-get update -qq && apt-get install -y -qq tk
    - pip install uv --quiet
  script:
    - bash scripts/build.sh
  artifacts:
    paths:
      - dist/git-sentinel
      - dist/git-sentinel.exe
    expire_in: 1 week

# ── Build jobs ────────────────────────────────────────────────────────────────

# Skipped on scheduled pipelines (build:nightly handles those) and on test:
# commits (no binary needed when only tests changed).
build:
  extends: .build
  rules:
      # not on schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never

      # not when commit type is test
    - if: $CI_COMMIT_MESSAGE =~ /^test(\(.+\))?!?:/
      when: never

      # otherwise always
    - when: always

# Windows build; PyInstaller auto-appends .exe on Windows.
build:windows:
  stage: build
  tags:
    - windows
  before_script:
    - pip install uv --quiet
  script:
    - uv sync --frozen --group dev
    - pwsh scripts/build.ps1
  artifacts:
    paths:
      - dist/git-sentinel.exe
    expire_in: 1 week
  rules:
      # not on schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never

      # not when commit type is test
    - if: $CI_COMMIT_MESSAGE =~ /^test(\(.+\))?!?:/
      when: never

      # otherwise always
    - when: always

# Nightly builds (Linux + Windows) live in .gitlab/ci/nightly.yml, triggered
# by trigger:nightly above.

# ─────────────────────────────────────────────────| Shared publish template |──

.publish:
  stage: publish
  image: curlimages/curl:latest
  interruptible: false    # never cancel a mid-flight upload
  script:
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "dist/$BINARY" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE/$PACKAGE_VERSION/$BINARY"

# ────────────────────────────────────────────────────────────| Publish jobs |──

publish:release:
  extends: .publish
  needs: [build]
  variables:
    PACKAGE_VERSION: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

publish:windows:release:
  extends: .publish
  needs: [build:windows]
  variables:
    PACKAGE_VERSION: $CI_COMMIT_TAG
    BINARY: git-sentinel.exe
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# publish:nightly and publish:windows:nightly live in .gitlab/ci/nightly.yml,
# triggered by trigger:nightly above.

# ─────────────────────────────────────────────────────────────────| Release |──

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false    # never cancel a mid-flight release
  needs: [publish:release, publish:windows:release]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - |
      if echo "$CI_COMMIT_TAG" | grep -qE '[-.]alpha\.'; then
        CHANNEL="alpha"
      elif echo "$CI_COMMIT_TAG" | grep -qE '[-.]beta\.'; then
        CHANNEL="beta"
      else
        CHANNEL="stable"
      fi
      sh scripts/gen-release-notes.sh "$CI_COMMIT_TAG" "$CHANNEL" > release-notes.md
  release:
    name: "git-sentinel $CI_COMMIT_TAG"
    description: "./release-notes.md"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "git-sentinel (Linux x86_64)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE/$CI_COMMIT_TAG/git-sentinel"
          link_type: package
        - name: "git-sentinel.exe (Windows x86_64)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE/$CI_COMMIT_TAG/git-sentinel.exe"
          link_type: package
