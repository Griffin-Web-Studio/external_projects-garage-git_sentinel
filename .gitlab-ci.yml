# ──────────────────────────────────────────────────────────────────────────────
# git-sentinel CI/CD pipeline
#
# Stages:
#   test    - mypy strict + pytest (runs on every pipeline)
#   build   - compile the PyInstaller binary
#   publish - upload the binary to the Generic Package Registry
#   release - create a GitLab Release (tagged builds only)
#
# Triggers:
#   MR / commit on main        → test (Linux + Windows) → build (Linux only)
#   versioned tag              → test → build (Linux + Windows) → publish → release
#   scheduled pipeline (main)  → test (Linux only) → build → publish (nightly, rolling)
#
# Skipped entirely (commit type filter):
#   docs, chore, style         → no pipeline created
#
# Partially skipped:
#   test                       → pipeline runs, build stage skipped
#
# Tag conventions (commitizen semver2 scheme):
#   v1.2.3             stable release
#   v1.2.3-alpha.0     alpha pre-release  (cz bump --prerelease alpha)
#   v1.2.3-beta.0      beta pre-release   (cz bump --prerelease beta)
#   v1.2.3-rc.0        release candidate  (cz bump --prerelease rc)
#
# Nightly setup:
#   Go to CI/CD → Schedules in GitLab and create a schedule targeting
#   the main branch (e.g. daily at 03:00 UTC).  Each run overwrites the
#   single "nightly" package entry so the download URL stays stable.
#
# Nightly download URL (once a schedule has run):
#   $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/git-sentinel/nightly
#   /git-sentinel
# ──────────────────────────────────────────────────────────────────────────────

# Prevents duplicate pipelines when pushing to a branch with an open MR.
# Without this, GitLab fires both a branch pipeline and an MR pipeline.
#
# auto_cancel on_new_commit: interruptible - when a new commit is pushed,
# cancel any running jobs marked interruptible: true (test, build).
# Publish and release jobs are explicitly marked interruptible: false so
# they are never cancelled mid-run.
#
# Commit type filtering (first-match wins; schedule/tag are exempt):
#   docs, chore, style → pipeline skipped entirely
#   test               → pipeline runs but build stage is skipped
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"            # nightly always runs
    - if: $CI_COMMIT_TAG                               # release tags always run
    - if: $CI_COMMIT_MESSAGE =~ /^(docs|chore|style)(\(.+\))?!?:/
      when: never                                      # skip docs/chore/style
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # MR pipelines only (suppresses branch pipeline)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH      # pushes to main

# Mark all jobs interruptible by default; publish/release override this below.
# Default to the self-hosted Linux runner; Windows jobs override the tag.
default:
  interruptible: true
  tags:
    - linux

stages:
  - test
  - build
  - publish
  - release

variables:
  BINARY:  git-sentinel
  PACKAGE: git-sentinel

# ────────────────────────────────────────────────────────────────────| Test |──

# Runs on every pipeline (MRs, main, tags, scheduled).
# mypy strict + pytest with a 75% coverage gate.
test:
  stage: test
  image: python:3.14
  before_script:
    - pip install uv --quiet
  script:
    - uv sync --frozen --group dev
    - uv run mypy --strict src/ git-sentinel
    - uv run pytest --cov=src --cov-fail-under=75 --cov-report=term-missing -q
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'

# Shell executor on a self-hosted Windows runner.
# Skips linux_only tests; runs windows_only tests that are skipped above.
# Excluded from scheduled (nightly) pipelines to conserve runner time.
test:windows:
  stage: test
  tags:
    - windows
  before_script:
    - pip install uv --quiet
  script:
    - uv sync --frozen --group dev
    - uv run mypy --strict src/ git-sentinel
    - uv run pytest -q -m "not linux_only" --cov=src --cov-report=term-missing
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always

# ───────────────────────────────────────────────────| Shared build template |──

.build:
  stage: build
  image: python:3.14
  before_script:
    - apt-get update -qq && apt-get install -y -qq tk
    - pip install uv --quiet
  script:
    - bash scripts/build.sh
  artifacts:
    paths:
      - dist/git-sentinel
    expire_in: 1 week

# ──────────────────────────────────────────────────────────────| Build jobs |──

# Skipped on scheduled pipelines (build:nightly handles those) and on test:
# commits (no binary needed when only tests changed).
build:
  extends: .build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /^test(\(.+\))?!?:/
      when: never
    - when: always

# Runs only on scheduled pipelines; artifact expires quickly since it is
# immediately re-uploaded to the package registry as "nightly".
build:nightly:
  extends: .build
  artifacts:
    paths:
      - dist/git-sentinel
    expire_in: 3 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Windows build - shell executor; PyInstaller auto-appends .exe on Windows.
# Runs only on release tags.
build:windows:
  stage: build
  tags:
    - windows
  before_script:
    - pip install uv --quiet
  script:
    - uv sync --frozen --group dev
    - pwsh scripts/build.ps1
  artifacts:
    paths:
      - dist/git-sentinel.exe
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /^test(\(.+\))?!?:/
      when: never
    - when: always

# ─────────────────────────────────────────────────| Shared publish template |──

.publish:
  stage: publish
  image: curlimages/curl:latest
  interruptible: false   # never cancel a mid-flight upload
  script:
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "dist/$BINARY" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE/$PACKAGE_VERSION/$BINARY"

# ────────────────────────────────────────────────────────────| Publish jobs |──

publish:release:
  extends: .publish
  needs: [build]
  variables:
    PACKAGE_VERSION: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

publish:windows:release:
  extends: .publish
  needs: [build:windows]
  variables:
    PACKAGE_VERSION: $CI_COMMIT_TAG
    BINARY: git-sentinel.exe
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# Overwrites the single "nightly" entry on every scheduled run.
publish:nightly:
  extends: .publish
  needs: [build:nightly]
  variables:
    PACKAGE_VERSION: nightly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ─────────────────────────────────────────────────────────────────| Release |──

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false   # never cancel a mid-flight release
  needs: [publish:release, publish:windows:release]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - |
      if echo "$CI_COMMIT_TAG" | grep -qE '[-.]alpha\.'; then
        CHANNEL="alpha"
      elif echo "$CI_COMMIT_TAG" | grep -qE '[-.]beta\.'; then
        CHANNEL="beta"
      else
        CHANNEL="stable"
      fi
      sh scripts/gen-release-notes.sh "$CI_COMMIT_TAG" "$CHANNEL" > release-notes.md
  release:
    name: "git-sentinel $CI_COMMIT_TAG"
    description: "./release-notes.md"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "git-sentinel (Linux x86_64)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE/$CI_COMMIT_TAG/git-sentinel"
          link_type: package
        - name: "git-sentinel.exe (Windows x86_64)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE/$CI_COMMIT_TAG/git-sentinel.exe"
          link_type: package
